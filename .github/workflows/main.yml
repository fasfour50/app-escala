name: Teste I-Flight

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Criar estado de login
        env:
          IFLIGHT_LOGIN_STATE: ${{ secrets.IFLIGHT_LOGIN_STATE }}
        run: |
          mkdir -p estado
          printf '%s' "$IFLIGHT_LOGIN_STATE" > estado/_login.json

      - name: Verificar estado
        run: |
          ls -l estado/_login.json
          python -c "import json; json.load(open('estado/_login.json')); print('JSON válido')"

      - name: Executar download da escala
        run: |
          python teste_download.py

      - name: Verificar arquivos gerados
        if: always()
        run: |
          echo "=== ARQUIVOS NA PASTA DO PROJETO ==="
          find . -maxdepth 5 -type f | sort

          echo ""
          echo "=== PASTA DOWNLOADS ==="
          ls -la downloads/ || true

          echo ""
          echo "=== PASTA ESCALA ==="
          ls -la downloads/escala/ || true

      - name: Enviar escala como Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: escala-atual
          path: |
            downloads/escala/_atual.pdf
            downloads/escala/*.pdf
          if-no-files-found: warn
